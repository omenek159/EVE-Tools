<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EVE Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try { const t = (JSON.parse(localStorage.getItem("eveTools.app.v1") || "{}")).theme; if (t && t !== "auto") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="modulepreload" href="js/shared.js">
<script type="module" src="js/app.js"></script>
</head>
<body>

<header class="appbar">
  <div class="inner">
    <a class="logo" href="#" aria-label="EVE Tools home">
      <div class="logo-ph" aria-hidden="true">LOGO</div>
      <div class="logo-name">EVE <span>Tools</span></div>
    </a>
    <div class="spacer"></div>
    <button class="icon-btn" id="openSettings" type="button" aria-haspopup="dialog" aria-controls="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Settings</span>
    </button>
  </div>
</header>

<nav class="menu" aria-label="Tools">
  <div class="inner" id="menuItems"></div>
</nav>

<div class="inner" id="updWrap" hidden>
  <div class="upd" id="updBar" role="status">
    <span id="updText"></span>
    <span class="upd-actions">
      <button class="btn btn-upd" id="updReload" type="button">Reload</button>
      <button class="btn" id="updLater" type="button">Later</button>
    </span>
  </div>
</div>

<div id="views"></div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="settings" role="dialog" aria-modal="true" aria-labelledby="h-settings" hidden>
  <header>
    <h2 id="h-settings">Settings</h2>
    <button class="btn-ghost" id="closeSettings" type="button" aria-label="Close settings" style="font-size:18px">✕</button>
  </header>
  <div class="body">
    <div class="grp">
      <h2>Appearance</h2>
      <div class="seg full" id="setTheme" role="group" aria-label="Theme">
        <button type="button" data-theme="auto">Auto</button>
        <button type="button" data-theme="light">Light</button>
        <button type="button" data-theme="dark">Dark</button>
      </div>
    </div>
    <div class="grp">
      <h2>Start page</h2>
      <select id="setStart" aria-label="Start page"></select>
      <span class="hint">Opens when the page loads without a tool in the link.</span>
    </div>
    <div class="grp">
      <h2>Saved data</h2>
      <span class="hint">Your fleets, prices and inputs are kept in this browser only.</span>
      <div id="resetButtons" style="display:flex;flex-direction:column;gap:8px"></div>
      <span class="msg" id="resetMsg" role="status"></span>
    </div>
    <div class="grp">
      <span class="hint">EVE Tools version <b id="appVer"></b></span>
    </div>
  </div>
</aside>

<div id="tip" hidden></div>
</body>
</html>
